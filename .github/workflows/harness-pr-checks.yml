# cat-harness's checks on every pull request (owner, 2026-10-14: every
# harnessed layer is judged by ONE reusable workflow the harness owns, and
# "there shouldnt be copying of code"). Everything is decided there.
name: Harness PR checks
on:
  pull_request:
    # Draft PRs run only the fast tier (bean dft1);
    # ready_for_review re-runs the full tier the moment a PR is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]
  # main's own run keeps main's answer, the gate seconds and the cone records
  # in caches every PR can read (the tools layer's #406, #411); a run on a PR
  # can only read caches saved from its own PR or from main.
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    uses: litlfred/cat-harness-tools/.github/workflows/layer-pr-checks.yml@main
    with:
      # On a draft PR: prepare and typecheck only; the full tier runs on ready_for_review.
      draft-fast-tier: true
      # One job a side, not four (Q-CIS-2 A, fix 1). This layer's tests and
      # gates are about 6 minutes of work in all, while each extra job waited
      # about 18 minutes for a runner (measured 2026-11-01).
      gate-shards: 1
  # Each PR regenerates its own derived files before it merges (owner,
  # 2026-11-06, option 1): the regen writers run at the PR's head and, when a
  # tracked file changed, ONE `chore(derived)` commit goes to the PR's own
  # branch (from a fork: none, and this fails with the command to run). The
  # PR's checks then judge that commit, so the regen reaches main through the
  # normal, tested merge. A ready PR only: it regenerates the composed index,
  # about an hour of runner time. `REGEN_PUSH_TOKEN` (a token with contents:
  # write here) lets the commit's push start the checks; without it the push
  # uses GITHUB_TOKEN, which starts none, and this job fails saying so. See
  # https://github.com/litlfred/cat-harness-tools/blob/main/.github/workflows/layer-post-merge-regen.yml
  regen:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == false }}
    permissions:
      contents: write
      pull-requests: write
    uses: litlfred/cat-harness-tools/.github/workflows/layer-post-merge-regen.yml@main
    with:
      mode: pr
    secrets:
      regen-push-token: ${{ secrets.REGEN_PUSH_TOKEN }}
  # Post-merge QA of main (owner, 2026-10-30, "Both"): the push run above
  # judged main's whole gate set; this keeps one `main-red` issue open while
  # main is red and closes it when main is green. See
  # https://github.com/litlfred/cat-harness-tools/blob/main/.github/workflows/layer-main-qa.yml
  main-qa:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'push' }}
    permissions:
      contents: read
      issues: write
      actions: read
    uses: litlfred/cat-harness-tools/.github/workflows/layer-main-qa.yml@main
    with:
      verdict: ${{ needs.checks.outputs.main-verdict }}
      failures: ${{ needs.checks.outputs.main-failures }}
      checks-result: ${{ needs.checks.result }}
