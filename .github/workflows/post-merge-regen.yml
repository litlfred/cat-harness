# Post-merge regeneration CHECK — bean `folio-assistant-ey1c`. Verify and warn
# only (owner, 2026-11-06, options "1 3").
#
# ## The failure this exists for
#
# After a PR merges into `main`, a merge that changes an enumerated or counted
# directory can leave `main` stale on a derived artefact (e.g.
# `readme:subgraphs:check` step 65 counting files in `uploads/`).
#
# ## Where the regen happens now
#
# 1. In each PR: `harness-pr-checks.yml`'s `regen` job commits the regen to the
#    PR's own branch, so it reaches main through the normal, tested merge.
# 2. At release: `release-npm.yml` regenerates into the package it publishes,
#    and fails rather than publish stale output.
# 3. Here, after a merge: regenerate in the runner, say what was stale (a
#    warning and the step summary), and commit, push or open NOTHING. The
#    `automation/post-merge-regen-*` repair branches and PRs are gone: they
#    piled up with no CI once Actions could no longer open PRs here.
#
# Honest reporting stays: a check with no writer, or whose writer fails, is a
# red run (exit 1), never claimed as current.

# Since the split (bean 70lx) `post-merge:regen` is a cat-harness-tools script
# that runs in the composed folio-assistant index, not in this repository on
# its own: here, `bun run cat` found /usr/bin/cat and every run failed. The
# job is the harness's reusable `layer-post-merge-regen.yml`, which composes
# the index with this commit in place and regenerates (owner, 2026-10-15: "a"),
# here in its `verify` mode.

name: Post-merge regen check and repair

# AT MOST HOURLY (owner, 2026-11-01, card Q-PIPE-1 A; folio-assistant#2899).
# Every push to main used to start a ~38-minute regen: 31 in one day, back to
# back, each holding one of the account's 40 shared runner slots. Now an hourly
# `tick` asks whether main moved since the last regen and, only then,
# dispatches this workflow on main; the dispatched run is the check. Dispatch
# by hand to check now.
on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (audit only, run no writer)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # A dispatch with GITHUB_TOKEN does start a run (workflow_dispatch is the
  # exception to "events from GITHUB_TOKEN start nothing").
  tick:
    name: Has main moved since the last regen?
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPO/commits/main" --jq .sha)
          # The newest dispatched regen that was not cancelled, running or done.
          last=$(gh api "repos/$REPO/actions/workflows/post-merge-regen.yml/runs?event=workflow_dispatch&branch=main&per_page=20" \
            --jq '[.workflow_runs[] | select(.conclusion != "cancelled")][0].head_sha // ""')
          if [ "$main" = "$last" ]; then
            echo "main ${main:0:7} already has a regen run: nothing to do."
            exit 0
          fi
          echo "main moved (${last:0:7} -> ${main:0:7}): dispatching a regen."
          gh workflow run post-merge-regen.yml --repo "$REPO" --ref main

  regen:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
    uses: litlfred/cat-harness-tools/.github/workflows/layer-post-merge-regen.yml@main
    with:
      mode: verify
      dry-run: ${{ inputs.dry_run == true }}
